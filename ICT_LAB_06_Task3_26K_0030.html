<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <style>
    .card {
      width: 250px;
      border: 1px solid #171414;
      border-radius: 8px;
      padding: 16px;
      transition: 0.3s;
    }

    .card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      border-radius: 4px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: green;
    }

    button {
      background-color: #222;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <article class="card">
    <img src="product.png" alt="iphone 18 Pro Max">
    <h2>iphone 18 Pro Max</h2>
    <p>Apple's biggest Pro iPhone, with a large edge-to-edge display. Prolevel cameras and powerful performance in one sleek design</p>
    <p class="price">$799.99</p>
    <button type="button">Buy Now</button>
  </article>
</body>
</html>
